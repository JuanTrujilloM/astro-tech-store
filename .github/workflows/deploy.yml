name: Deploy to GCP

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and push image to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/astro-tech-store-image:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/astro-tech-store-image:${{ github.sha }}

  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy via SSH
        run: |
          gcloud compute ssh ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_INSTANCE }} \
            --zone=${{ secrets.GCP_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --command="
              docker pull ${{ secrets.DOCKERHUB_USERNAME }}/astro-tech-store-image:latest &&
              docker stop astro-tech-store-app || true &&
              docker rm astro-tech-store-app || true &&
              docker run -d \
                --name astro-tech-store-app \
                --restart unless-stopped \
                -p 80:80 \
                --env-file /home/${{ secrets.GCP_USERNAME }}/.env.docker.prod \
                -v sqlite_data:/var/www/html/database \
                -v storage_data:/var/www/html/storage \
                ${{ secrets.DOCKERHUB_USERNAME }}/astro-tech-store-image:latest
            "
  
  zap-scan:
    name: ZAP Security Scan
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ secrets.APP_URL }}
          rules_file_name: '.zap/rules.tsv'
