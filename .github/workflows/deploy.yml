name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, xml, ctype, fileinfo
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test --testsuite=Unit,Feature

  build-and-push:
    name: Build and push image to Docker Hub
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/astro-tech-store-image:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/astro-tech-store-image:${{ github.sha }}

      - name: Print digest
        run: echo "Digest -> ${{ steps.build.outputs.digest }}"

  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy via SSH
        run: |
          gcloud compute ssh ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_INSTANCE }} \
            --zone=${{ secrets.GCP_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --command="
              docker pull ${{ secrets.DOCKERHUB_USERNAME }}/astro-tech-store-image:${{ github.sha }} &&
              docker stop astro-tech-store-app || true &&
              docker rm astro-tech-store-app   || true &&
              docker run -d \
                --name astro-tech-store-app \
                --restart unless-stopped \
                -p 80:80 \
                --env-file /home/${{ secrets.GCP_USERNAME }}/.env.docker.prod \
                -v sqlite_data:/var/www/html/database \
                -v storage_data:/var/www/html/storage \
                ${{ secrets.DOCKERHUB_USERNAME }}/astro-tech-store-image:${{ github.sha }} &&
              docker image prune -a -f
            "
